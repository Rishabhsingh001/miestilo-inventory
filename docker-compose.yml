services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miestilo_erp_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/miestilo_production
      - MONGODB_DB_NAME=miestilo_production
      - AUTH_SECRET=${AUTH_SECRET:-miestilo-production-secret-change-me-random-64-hex}
      - APP_NAME=MiEstilo Luxury Linen Inventory
      - DEFAULT_TIMEZONE=Asia/Kolkata
      - DEFAULT_CURRENCY=INR
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: miestilo_erp_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
    driver: local
